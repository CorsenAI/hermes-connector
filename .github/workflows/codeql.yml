name: CodeQL

on:
  push:
    branches: [main, 'fix/security-*']
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze source
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: '/language:${{ matrix.language }}'
          output: '${{ runner.temp }}/codeql-results'
      - name: Verify findings and reviewed source
        if: success()
        shell: bash
        env:
          SARIF_DIR: '${{ runner.temp }}/codeql-results'
        run: |
          set -euo pipefail
          python scripts/check_codeql.py "$SARIF_DIR" --reviews .github/codeql-reviewed.json 2>&1 | tee "$SARIF_DIR/verification.txt"
      - name: Record analyzed source revision
        if: always()
        shell: bash
        env:
          SARIF_DIR: '${{ runner.temp }}/codeql-results'
        run: |
          set -euo pipefail
          mkdir -p "$SARIF_DIR"
          git rev-parse HEAD > "$SARIF_DIR/source-commit.txt"
          git archive --format=zip --output="$SARIF_DIR/source.zip" HEAD
      - name: Retain analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-${{ matrix.language }}-${{ github.event_name }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/codeql-results/*.sarif
            ${{ runner.temp }}/codeql-results/verification.txt
            ${{ runner.temp }}/codeql-results/source-commit.txt
            ${{ runner.temp }}/codeql-results/source.zip
          if-no-files-found: error
          retention-days: 7
