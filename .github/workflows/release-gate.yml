name: Release gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    name: Fast gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install test dependency
        run: python -m pip install websockets==15.0.1
      - name: Run release gate
        run: python tests/run_all.py
      - name: Exercise POSIX installer
        if: runner.os != 'Windows'
        shell: sh
        run: sh tests/e2e_installer_posix.sh
      - name: Exercise PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/e2e_installer_windows.ps1
      - name: Build clean release archives
        if: runner.os == 'Linux'
        run: python scripts/build_release.py --skip-tests
      - name: Run packaged Chrome acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_CHROME=/usr/local/share/chromium/chrome-linux/chrome
          CHROME_BINARY="$(/usr/bin/readlink -f -- /usr/bin/chromium)"
          test "$CHROME_BINARY" = "$EXPECTED_CHROME"

          root_owned_nonwritable() {
            local path="$1" mode
            test "$(/usr/bin/stat -c '%u:%g' -- "$path")" = 0:0
            mode="$(/usr/bin/stat -c '%a' -- "$path")"
            (( (8#$mode & 0022) == 0 ))
          }

          for path in \
            /usr/local \
            /usr/local/share \
            /usr/local/share/chromium \
            /usr/local/share/chromium/chrome-linux
          do
            test -d "$path"
            test ! -L "$path"
            root_owned_nonwritable "$path"
          done

          test -f "$CHROME_BINARY"
          test ! -L "$CHROME_BINARY"
          test -x "$CHROME_BINARY"
          root_owned_nonwritable "$CHROME_BINARY"

          test "$(< /sys/module/apparmor/parameters/enabled)" = Y
          test "$(/usr/sbin/sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1
          test -x /usr/sbin/apparmor_parser
          root_owned_nonwritable /etc
          root_owned_nonwritable /etc/apparmor.d

          PROFILE=/etc/apparmor.d/hermes-connector-ci
          test ! -e "$PROFILE"
          test ! -L "$PROFILE"
          /usr/bin/sudo /usr/bin/tee "$PROFILE" >/dev/null <<'APPARMOR'
          abi <abi/4.0>,
          include <tunables/global>

          profile hermes-connector-ci /usr/local/share/chromium/chrome-linux/chrome flags=(unconfined) {
            userns,
          }
          APPARMOR
          /usr/bin/sudo /usr/bin/chown root:root -- "$PROFILE"
          /usr/bin/sudo /usr/bin/chmod 0644 -- "$PROFILE"
          test -f "$PROFILE"
          test ! -L "$PROFILE"
          test "$(/usr/bin/stat -c '%u:%g:%a' -- "$PROFILE")" = 0:0:644

          /usr/bin/sudo /usr/sbin/apparmor_parser -r "$PROFILE"
          /usr/bin/sudo /usr/bin/grep -F -- \
            'hermes-connector-ci' /sys/kernel/security/apparmor/profiles
          test "$(/usr/sbin/sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1

          unset CHROME_DEVEL_SANDBOX
          export CHROME_BINARY
          "$CHROME_BINARY" --version
          python tests/e2e_packaged_release.py
