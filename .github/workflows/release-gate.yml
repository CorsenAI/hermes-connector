name: Release gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-gate:
    name: Fast gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependency
        run: python -m pip install websockets==15.0.1
      - name: Run release gate
        run: python tests/run_all.py
      - name: Exercise POSIX installer
        if: runner.os != 'Windows'
        shell: sh
        run: sh tests/e2e_installer_posix.sh
      - name: Exercise PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/e2e_installer_windows.ps1
      - name: Build clean release archives
        if: runner.os == 'Linux'
        run: python scripts/build_release.py --skip-tests
      - name: Run packaged Chrome acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BINARY="$(/usr/bin/readlink -f -- /usr/bin/chromium)"
          CHROME_DIR="${CHROME_BINARY%/*}"
          SANDBOX_SOURCE="$CHROME_DIR/chrome_sandbox"
          SANDBOX_DEST=/usr/local/sbin/chrome-devel-sandbox

          root_owned_nonwritable() {
            local path="$1" mode
            test "$(/usr/bin/stat -c '%u:%g' -- "$path")" = 0:0
            mode="$(/usr/bin/stat -c '%a' -- "$path")"
            (( (8#$mode & 0022) == 0 ))
          }

          test -f "$CHROME_BINARY"
          test ! -L "$CHROME_BINARY"
          test -x "$CHROME_BINARY"
          test -d "$CHROME_DIR"
          test ! -L "$CHROME_DIR"
          root_owned_nonwritable "$CHROME_DIR"
          root_owned_nonwritable "$CHROME_BINARY"

          test -f "$SANDBOX_SOURCE"
          test ! -L "$SANDBOX_SOURCE"
          test -x "$SANDBOX_SOURCE"
          root_owned_nonwritable "$SANDBOX_SOURCE"
          root_owned_nonwritable /usr/local/sbin

          test ! -e "$SANDBOX_DEST"
          test ! -L "$SANDBOX_DEST"
          /usr/bin/sudo /usr/bin/install -o root -g root -m 4755 -- \
            "$SANDBOX_SOURCE" "$SANDBOX_DEST"

          test -f "$SANDBOX_DEST"
          test ! -L "$SANDBOX_DEST"
          test -x "$SANDBOX_DEST"
          test -u "$SANDBOX_DEST"
          test "$(/usr/bin/stat -c '%u:%g:%a' -- "$SANDBOX_DEST")" = 0:0:4755
          /usr/bin/cmp -s -- "$SANDBOX_SOURCE" "$SANDBOX_DEST"

          export CHROME_BINARY
          export CHROME_DEVEL_SANDBOX="$SANDBOX_DEST"
          "$CHROME_BINARY" --version
          python tests/e2e_packaged_release.py
