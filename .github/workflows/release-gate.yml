name: Release gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-gate:
    name: Fast gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependency
        run: python -m pip install websockets==15.0.1
      - name: Run release gate
        run: python tests/run_all.py
      - name: Exercise POSIX installer
        if: runner.os != 'Windows'
        shell: sh
        run: sh tests/e2e_installer_posix.sh
      - name: Exercise PowerShell installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/e2e_installer_windows.ps1
      - name: Build clean release archives
        if: runner.os == 'Linux'
        run: python scripts/build_release.py --skip-tests
      - name: Run packaged Chrome acceptance
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BINARY="$(readlink -f "$(command -v chromium)")"
          export CHROME_DEVEL_SANDBOX=/opt/google/chrome/chrome-sandbox
          test -x "$CHROME_BINARY"
          test -u "$CHROME_DEVEL_SANDBOX"
          test "$(stat -c '%U:%G' "$CHROME_DEVEL_SANDBOX")" = root:root
          test "$(stat -c '%a' "$CHROME_DEVEL_SANDBOX")" = 4755
          "$CHROME_BINARY" --version
          python tests/e2e_packaged_release.py
